<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var key = "lexus-showroom-theme";
          var stored = localStorage.getItem(key);
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <title>Lexus Showroom</title>
    <meta name="description" content="Lexus Showroom — explore the ES, RX, NX, and LX lineup." />
    <link rel="canonical" href="https://jnibarger01.github.io/lexus-showroom/" />

    <meta property="og:title" content="Lexus Showroom" />
    <meta property="og:description" content="Lexus Showroom — explore the ES, RX, NX, and LX lineup." />

</html>
